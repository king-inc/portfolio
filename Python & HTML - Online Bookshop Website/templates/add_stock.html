{% import "bootstrap/wtf.html" as wtf%} <!--this is a module for handling wtforms using bootstrap-->

<!DOCTYPE html>
<html lang="en">
<head>
    <title>Add Stock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
</head>
  <body>
    <header><!--header of the page-->
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark "> <!--this is navigation bar at the top of the page with dark background-->
        <div class="container-fluid justify-content-start d-grid gap-2 d-md-flex">
          <a href="stock_level" class="btn btn-dark">
            <svg xmlns="http://www.w3.org/2000/svg" width="23" height="23" fill="currentColor" class="bi bi-caret-left" viewBox="0 0 16 16">
              <path d="M10 12.796V3.204L4.519 8 10 12.796zm-.659.753-5.48-4.796a1 1 0 0 1 0-1.506l5.48-4.796A1 1 0 0 1 11 3.204v9.592a1 1 0 0 1-1.659.753z"/>
            </svg>
          </a>
          
          <a class="navbar-brand" href="#">Add Stock</a>
        </div>
      </nav>
    </header>
    <main>
      <div class="container py-5">
      <form action="/add_stock" method='POST' enctype='multipart/form-data'>
        <h3 class="h4 mb-3 fw-normal">Please enter book information:</h3>
          {{form.crsf_token}}
          <div class="col-4">{{wtf.form_field(form.bkname)}}</div>
          <div class="col-4">{{wtf.form_field(form.author)}}</div><br>
          <div class="col-4">{{wtf.form_field(form.date)}}</div><br>
          <div class="col-4 form-group  required">
            <label class="control-label" for="isbn">ISBN Number</label>
            <input class="form-control" id="isbn" name="isbn" required="" type="number" value="">
          </div><br>
          <div class="col-4">{{wtf.form_field(form.desc)}}</div><br>
          <div class="col-4">{{wtf.form_field(form.image)}}</div><br>
          <div class="col-4">
            <label for="trade_input">Trading Price</label> 
            <div class=form-group>
              <input name='trade_price' id="trade_input" style="width: 420px;" type="range" min="1" max="100" oninput="trade_amount.value=trade_input.value" />
             £ <input id="trade_amount" readonly type="number" value="50" min="1" max="100" oninput="trade_input.value=trade_amount.value" />
            </div>
          </div><br>
        
        <div class="col-4">
            <label for="retail_input">Retail Price</label> 
            <div class=form-group>
               <input name='retail_price' id="retail_input" style="width: 420px;" type="range" min="1" max="100" oninput="retail_amount.value=retail_input.value" />
              £ <input id="retail_amount" readonly type="number" value="50" min="1" max="100" oninput="retail_input.value=retail_amount.value" />
          </div>
        </div><br>
          
        <div class="col-4">
            <label for="quantity_input">Quantity of Books</label> 
            <div class=form-group>
               <input name='quantity' id="quantity_input" style="width: 420px;" type="range" min="1" max="20" oninput="quantity_amount.value=quantity_input.value" />
               <input id="quantity_amount" readonly type="number" value="10" min="1" max="20" oninput="quantity_input.value=quantity_amount.value" />
          </div>
        </div><br>
        
        <p> <input class="btn btn-primary" type="submit" value="Add"> </p>
      </form>
      </div>
    </main>
  </body>
</html>
