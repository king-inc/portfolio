{% import "bootstrap/wtf.html" as wtf%} <!--this is a module for handling wtforms using bootstrap-->

<!DOCTYPE html>
<html>
  
  <head>
    <title>Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
  </head>
  
  <body>
    
    <header>
      <nav class="navbar navbar-dark bg-dark "> <!--this is navigation bar at the top of the page with dark background-->
        <div class="container-fluid px-5">
          <a class="navbar-brand" href="#"><h3>Checkout</h3></a>
        </div>
      </nav>
    </header>
    
    <main>
      <div class="container py-5">
        <form action="/checkout" method="POST">
          <h3 class="h4 mb-3 fw-normal">Please enter card details:</h3>
          {{form.crsf_token}}
          <div class="col-4">
             {{wtf.form_field(form.name)}}
          </div><br>
          <div class="col-4">
            {{wtf.form_field(form.cnumber)}}
          </div><br>
          <div class="col-4">
            {{wtf.form_field(form.exp)}}
          </div><br>
          <div class="col-4">
            {{wtf.form_field(form.cvv)}}
          </div><br>
          
          <ul class="list-group text-center">
            <li class="list-group-item col-2">
              <strong><h5>Total: &#8356;{{ session['all_total_price'] + session['postage'] }}</h5></strong>
            </li>
            <li class="list-group-item col-2">
              <input class="btn btn-primary btn-lg" type="submit" value="Pay">
            </li>
          </ul>         
                
        </form>
      </div>
    </main>
