<!DOCTYPE html>
<html>
<head>
  <title>The Bookshop</title>
  <!-- this links the bootstrap to the html-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
</head>

<body>
  <header><!--header of the page-->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark "> <!--this is navigation bar at the top of the page with dark background-->
      <div class="container-fluid justify-content-start d-grid gap-2 d-md-flex">
        <a class="navbar-brand" href="#">The BookShop</a>

        {% if session['username'] == 'admin': %}<!--this checks if the user logged in is the admin. If yes, display the stock level button -->
          <a href="stock_level">
            <button class="btn btn-outline-light" type="button">Stock Level</button>
          </a>
        {% endif %}
        
        <a class="btn btn-outline-light btn-sm" type="button" href="logout">Logout</a><!--button to logout-->
      </div>

      <div class="container-fluid justify-content-end"><!--this displays the cart at the right hand side of the navigation bar-->
        <a href= "cart">
          <button class="btn btn-outline-light">
            
            <!-- this is a link to a shooping cart bootstrap icon -->
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-cart2" viewBox="0 0 16 16">
              <path d="M0 2.5A.5.5 0 0 1 .5 2H2a.5.5 0 0 1 .485.379L2.89 4H14.5a.5.5 0 0 1 .485.621l-1.5 6A.5.5 0 0 1 13 11H4a.5.5 0 0 1-.485-.379L1.61 3H.5a.5.5 0 0 1-.5-.5zM3.14 5l1.25 5h8.22l1.25-5H3.14zM5 13a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm-2 1a2 2 0 1 1 4 0 2 2 0 0 1-4 0zm9-1a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm-2 1a2 2 0 1 1 4 0 2 2 0 0 1-4 0z"/>
            </svg>
            
            <!-- this checks if there's a book in cart and if yes, displays the total quantity and total price-->
            {% if 'all_total_price' in session %}
              {% if (session['all_total_price']>0) %}
                <br><div class="total">Total Price: £{{session['all_total_price']}}<br>Total Books: {{session['all_total_quantity']}}</div>
              {% endif %}
            {% endif %}
            
          </button>
        </a>
      </div>
    </nav>
  </header>
  
  <main><!-- this is the main body of the html-->
    {% if Path("book_stock.db").exists() %} <!--this checks if the database of books exists-->
      <div class="py-5 bg-light"><!--set the top and bottom margin to 5 and set the background to light grey--> 
          <div class="container">
            <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-5"><!--sets the column and row size of the books being displayed-->

              {% for book in books %} <!-- this iterates through the database of books that have been added-->
                {% if book[8] > 0 %}<!-- this checks if the there is any book in stock in case user buys all in stock -->
                  <form action="/add" method="POST">
                    <div class="col border border-2 text-center"><!--sets a border around each book display and centers it-->
                      <img src="{{book[5]}}" class="rounded" width="230" height="280">
                      <div class="card-body">
                        <div class="card-text">{{ book[1] }}</div>
                        <p><div>
                          <input type="hidden" name="isbn" value="{{ book[0] }}" />
                          <input type="hidden" name="quantity" value="1" />
                          <input type="submit" value="Add to Cart" class="btn btn-outline-success" />
                        </div>
                      </div>
                    </div>
                  </form>
                {% endif %}
              {% endfor %}
            </div>
          </div>
      </div>

    {% else %}<!-- if there are no books currently -->
      <div class="card-text text-center py-5">No books currently</div>
    {% endif %}

  </main>
</body>
</html>
