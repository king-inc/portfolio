{% import "bootstrap/wtf.html" as wtf%} <!--this is a module for handling wtforms using bootstrap-->

<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
</head>
  
<body class="text-center bg-light">
  <header><!--header of the page-->
    <nav class="navbar navbar-dark bg-dark "> <!--this is navigation bar at the top of the page with dark background-->
      <div class="container justify-content-center">
        <a class="navbar-brand" href="#"><H1>The Bookshop</H1></a>
      </div>
    </nav>
  </header>

  <main>
    <div class="container py-5">
      <form action="{{page}}" method="POST">
        <h3 class="h4 mb-3 fw-normal">Please enter your username and password:</h3>
        {{ form.csrf_token }}
        <div class="container col-4 ">{{ wtf.form_field(form.uname) }}</div>
        <div class="container col-4">{{ wtf.form_field(form.pwd) }}</div>
        <div class="container pt-2"><input class="btn btn-primary pt-2" type="submit" value="Login"></div>
      </form>

      {% if error %}
        <br>
        <p class="error"><strong>Error:</strong>{{ error }}</p>
      {% endif %}
      <br>
      <p>Don't have an account? <a href="register" class="btn btn-primary btn-sm">Register here</a></p>
    </div>
  </main>
</body>
</html>
