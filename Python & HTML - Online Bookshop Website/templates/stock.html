<!DOCTYPE html>
<html>
<head>
  <title>Stock</title>
  <!-- this links the bootstrap to the html-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
</head>

<body class="bg-light">
  <header><!--header of the page-->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark "> <!--this is navigation bar at the top of the page with dark background-->
      <div class="container-fluid justify-content-start d-grid gap-2 d-md-flex">
        
          <!-- this is return to homepage button -->
          <a href="/" class="btn btn-dark">
            <svg xmlns="http://www.w3.org/2000/svg" width="23" height="23" fill="currentColor" class="bi bi-caret-left" viewBox="0 0 16 16">
              <path d="M10 12.796V3.204L4.519 8 10 12.796zm-.659.753-5.48-4.796a1 1 0 0 1 0-1.506l5.48-4.796A1 1 0 0 1 11 3.204v9.592a1 1 0 0 1-1.659.753z"/>
            </svg>
          </a>
      
        <a class="navbar-brand" href="#">Stock</a>
     </div>
      
        <div class="container-fluid justify-content-end">
          <!--this is the button that directs the admin to add stock page-->
          <a href="{{url_for('stock.add_stock')}}" class="btn btn-outline-light" type="button">Add Stock</a>
        </div>
    </nav>
  </header>
  
  <main><!--this is the main body of the html -->
    {% if Path("book_stock.db").exists() %} <!--this checks if the database of books exists-->
      <div class="py-5 bg-light"><!--set the top and bottom margin to 5 and set the background to light grey--> 
        <div class="container">
          <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-5"><!--sets the column and row size of the books being displayed-->
            
            {% for book in books %} 
            <!--this iterates through the database of books that have been added-->
              <div>
                <div class="col border border-2 text-center"><!--sets a border around each book display and centers it-->
                  <img src="{{book[5]}}" class="rounded" width="230" height="280">
                  <div class="card-body">
                    <div class="card-text">{{ book[1] }}</div>
                    <div class="card-text">ISBN: {{ book[0] }}</div>
                    <div class="card-text">In Stock: {{ book[8] }}</div>
                  </div>
                </div>
              </div>
            {% endfor %}
          </div>
        </div>
      </div>
    {% else %}<!-- if there are no books currently -->
      <div class="card-text text-center py-5">No books currently!</div>
    {% endif %}
  </main>
</body>
</html>
